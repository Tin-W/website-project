<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AXG Shop - Model Marketplace</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 導覽列 -->
  <nav class="navbar">
    <div class="logo" data-i18n="brand">AXG 購物網</div>
    <div class="nav-links">
      <a href="index.html" data-i18n="nav_home">首頁</a>
      <a href="marketplace.html" class="active" data-i18n="nav_market">商城</a>
      <a href="about.html" data-i18n="nav_about">關於我們</a>
      <a href="admin.html" style="color: #f59e0b; font-weight: bold;">後台管理</a> <!-- 新增這行 -->
    </div>
    <div class="actions">
      <select id="langSelect" onchange="changeLanguage(this.value)">
        <option value="zh">繁體中文</option>
        <option value="en">English</option>
      </select>
      <button onclick="alert('登入功能開發中')" data-i18n="nav_login">登入 / 註冊</button>
    </div>
  </nav>

  <!-- 主區域：側邊欄 + 內容區 -->
  <div class="marketplace-layout">
    
    <!-- 左側 Filter 側邊欄 -->
    <aside class="sidebar">
      <h3 data-i18n="filter_title">Filter</h3>
      <div class="filter-group">
        <label data-i18n="filter_provider">Provider</label>
        <button class="filter-btn active" onclick="filterProvider('all')" data-i18n="filter_all">All vendors</button>
        <button class="filter-btn" onclick="filterProvider('openai')">OpenAI</button>
        <button class="filter-btn" onclick="filterProvider('deepseek')">DeepSeek</button>
        <button class="filter-btn" onclick="filterProvider('claude')">Anthropic (Claude)</button>
      </div>
    </aside>

    <!-- 右側主要內容區 -->
    <main class="main-content">
      <!-- 頂部藍色 Banner -->
      <div class="marketplace-banner">
        <h2><span data-i18n="banner_title">All vendors</span> <span class="vendor-count" id="vendorCount">3 models</span></h2>
        <p data-i18n="banner_desc">View all available AI model suppliers, including models from OpenAI, DeepSeek, and Anthropic.</p>
      </div>

      <!-- 商品模型 Grid -->
      <div class="model-grid" id="productGrid"></div>

      <!-- 模擬結帳 QR Code 顯示區 -->
      <div id="qrCodeContainer" style="text-align: center; margin-top: 30px;"></div>
    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
